name: CI

# Gate setiap pull request (dan setiap push ke main) dengan lint, typecheck,
# unit test (Vitest), build produksi dan smoke test Playwright — sehingga
# regresi (mis. pipeline WhatsApp, util uang, atau utility Tailwind yang tak
# valid) ketahuan sebelum di-deploy, bukan saat deploy.
#
# Hemat menit Actions (2026-10-17): push ke branch PR dulu menjalankan CI dua
# kali (event push DAN pull_request). Kini event push hanya untuk main, branch
# PR diuji lewat pull_request saja. Tes database ada di db.yml dan hanya jalan
# bila ada yang berubah di supabase/.
on:
  push:
    branches: [main]
  pull_request:

# Batalkan run lama pada ref yang sama saat ada push baru (hemat CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint · Typecheck · Test · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Dependensi sistem untuk paket native `canvas` (node-canvas) agar
      # `npm ci` tidak gagal saat build di runner Linux.
      - name: Install canvas system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # Compile the app so changes that typecheck but break the build (e.g. an
      # invalid Tailwind utility) are caught here, not at deploy. One build
      # serves both checks: the Playwright webServer below just runs
      # `next start` on it. The NEXT_PUBLIC_* values are placeholders; an empty
      # Turnstile key disables CAPTCHA so the login form is testable.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''

      # Tier 3 — Playwright smoke tests against the PRODUCTION build.
      # Unauthenticated (placeholder Supabase env, no secrets): proves the
      # artifact boots & serves, the Sarathi rebrand is live, and the proxy
      # auth-gate redirects to /login.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Secret scan — fails the PR if any commit in it ADDS a credential (API key,
  # token, app secret). Scans only the PR's own commits: older history is
  # handled by rotating the leaked keys, not by blocking every new PR.
  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan PR commits
        run: gitleaks git --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" .

name: Process WhatsApp Queue

# Cron cadangan untuk worker antrian WhatsApp (GET /api/queue/process).
#
# CATATAN PENTING: webhook sudah men-drain antrian secara real-time in-process
# (processQueue langsung + setTimeout tertunda). Job terjadwal ini adalah JARING
# PENGAMAN untuk pesan yang tertinggal saat server restart, sekaligus memicu
# digest follow-up harian dan cleanup tabel per jam. Jadi latensi backstop tak
# perlu ketat.
#
# Kenapa 15 menit (bukan 1 menit seperti contoh di docs/VPS_DEPLOYMENT.md)?
#   1. GitHub menagih tiap run DIBULATKAN KE ATAS per menit → jadwal 1-menit di
#      repo privat (~43rb menit/bulan) jauh melampaui kuota gratis (2000/bln).
#      15 menit tetap mengenai jendela digest & cleanup dengan biaya kecil.
#   2. Penjadwal cron GitHub TIDAK presisi per-menit — run bisa telat/digabung,
#      jadi cadence < 5 menit tak pernah dijamin.
# Untuk presisi 1-menit yang sebenarnya, pakai crontab VPS (Opsi 1 di dok) —
# gratis & tepat waktu. Workflow ini adalah alternatif "tanpa SSH".

on:
  schedule:
    - cron: '*/15 * * * *' # tiap 15 menit (UTC) — ubah cadence di sini
  workflow_dispatch: # jalankan manual dari tab Actions (untuk tes)

# Least-privilege: job ini hanya melakukan panggilan HTTP keluar, tak menyentuh repo.
permissions: {}

# Jangan menumpuk run: biarkan yang berjalan selesai sebelum yang berikutnya mulai.
concurrency:
  group: process-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Panggil worker antrian
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set GitHub Secrets APP_BASE_URL (mis. https://domain-kamu.com) & CRON_SECRET — Settings → Secrets and variables → Actions."
            exit 1
          fi
          # -f  : gagalkan step bila HTTP >= 400 → 401 (secret tak cocok) / 503
          #       (CRON_SECRET belum di-set di server) langsung terlihat merah.
          # -sS : senyap tapi tetap tampilkan pesan error.
          # --max-time: jangan pernah menggantung runner.
          # ${APP_BASE_URL%/}: buang trailing slash agar tak jadi '//api'.
          curl -fsS --max-time 60 \
            -X GET "${APP_BASE_URL%/}/api/queue/process" \
            -H "Authorization: Bearer ${CRON_SECRET}"

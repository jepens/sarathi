<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sarathi — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #e5e5e5;
        padding: calc(env(safe-area-inset-top) + 1.5rem) 1.5rem
          calc(env(safe-area-inset-bottom) + 1.5rem);
      }
      .card { text-align: center; max-width: 22rem; }
      .mark { font-size: 2.5rem; font-weight: 800; letter-spacing: -0.03em; }
      h1 { font-size: 1.1rem; margin: 1rem 0 0.5rem; }
      p { color: #a3a3a3; font-size: 0.9rem; line-height: 1.5; margin: 0 0 1.25rem; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 0.6rem;
        padding: 0.6rem 1.1rem;
        background: #ffffff;
        color: #000000;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">Sarathi</div>
      <h1>Tidak ada koneksi</h1>
      <p>Sepertinya kamu sedang offline. Periksa koneksi internet lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
